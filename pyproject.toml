[project]
name = "fintech-rag-prep"
version = "0.1.0"
description = "Weekend RAG + eval + MCP agent project for fintech AI Lead interview prep"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
